name: Otomatisasi Update Data Curah Hujan

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis tiap jam 07:00 WITA
  workflow_dispatch: # Supaya bisa di-run manual kapan saja

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Library
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        run: python main.py

      - name: Commit & Push File 9.csv
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 9.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update 9.csv" && git push)
